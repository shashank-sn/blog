<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">posts</a>
      <a href="https://github.com/shashank-sn/blog">github</a>
      <a href="https://github.com/shashank-sn/blog/issues/new/choose">ask a question</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>Posts © {{ 'now' | date: '%Y' }} {{ site.author }}. Skills are MIT licensed. Questions go in <a href="https://github.com/shashank-sn/blog/issues">GitHub issues</a>.</p>
  </footer>
</body>
</html>
