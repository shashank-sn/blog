<svg font-family="'Google Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" id="fig-what-counts" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wc-t">
  <title id="wc-t">all readings go in; controls and brand questions are held out; the rate is built only from what is left</title>
  <rect class="paper" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <style>
    #fig-what-counts .box { fill: #ffffff; stroke: #121212; stroke-width: 1.5; }
    #fig-what-counts .ink { fill: #121212; }
    #fig-what-counts .held { fill: #f5f5f5; stroke: #6b6b6b; stroke-width: 1.5; stroke-dasharray: 5 4; }
    #fig-what-counts .t { font-size: 15px; font-weight: 700; fill: #121212; }
    #fig-what-counts .tw { font-size: 15px; font-weight: 700; fill: #ffffff; }
    #fig-what-counts .s { font-size: 12.5px; fill: #6b6b6b; }
    #fig-what-counts .sw { font-size: 12.5px; fill: #d9d9d9; }
    #fig-what-counts .dot { fill: #121212; }
    #fig-what-counts .ring { fill: #ffffff; stroke: #121212; stroke-width: 1.5; }
    #fig-what-counts .sq { fill: #6b6b6b; }
    #fig-what-counts .line { stroke: #121212; stroke-width: 1.5; fill: none; }
    #fig-what-counts .dash { stroke: #6b6b6b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="wc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker>
    <marker id="wc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
  </defs>
  <!-- all readings -->
  <rect class="box" x="8" y="40" width="190" height="180" rx="10"/>
  <text class="t" x="22" y="64">every reading</text>
  <g>
    <circle class="dot" cx="34" cy="92" r="6"/><circle class="dot" cx="56" cy="92" r="6"/><circle class="ring" cx="78" cy="92" r="6"/><circle class="dot" cx="100" cy="92" r="6"/><rect class="sq" x="116" y="86" width="12" height="12"/><circle class="dot" cx="148" cy="92" r="6"/><circle class="dot" cx="170" cy="92" r="6"/>
    <circle class="dot" cx="34" cy="118" r="6"/><rect class="sq" x="50" y="112" width="12" height="12"/><circle class="dot" cx="78" cy="118" r="6"/><circle class="dot" cx="100" cy="118" r="6"/><circle class="dot" cx="122" cy="118" r="6"/><circle class="ring" cx="148" cy="118" r="6"/><circle class="dot" cx="170" cy="118" r="6"/>
    <circle class="ring" cx="34" cy="144" r="6"/><circle class="dot" cx="56" cy="144" r="6"/><circle class="dot" cx="78" cy="144" r="6"/><rect class="sq" x="94" y="138" width="12" height="12"/><circle class="dot" cx="122" cy="144" r="6"/><circle class="dot" cx="148" cy="144" r="6"/><circle class="dot" cx="170" cy="144" r="6"/>
  </g>
  <circle class="dot" cx="28" cy="180" r="5"/><text class="s" x="40" y="184">question</text>
  <circle class="ring" cx="110" cy="180" r="5"/><text class="s" x="122" y="184">control</text>
  <rect class="sq" x="23" y="196" width="10" height="10"/><text class="s" x="40" y="205">names the brand</text>
  <!-- rule file gate -->
  <path class="line" d="M198 130 H252" marker-end="url(#wc-a)"/>
  <rect class="ink" x="254" y="86" width="150" height="88" rx="10"/>
  <text class="tw" x="268" y="112">rule file</text>
  <text class="sw" x="268" y="134">decides what</text>
  <text class="sw" x="268" y="150">counts. nothing</text>
  <text class="sw" x="268" y="166">else does.</text>
  <!-- held out -->
  <path class="dash" d="M330 174 V214 H442" marker-end="url(#wc-g)"/>
  <rect class="held" x="444" y="190" width="228" height="60" rx="10"/>
  <text class="t" x="458" y="214">held out of every rate</text>
  <text class="s" x="458" y="234">controls, brand questions</text>
  <!-- the rate -->
  <path class="line" d="M404 112 H442" marker-end="url(#wc-a)"/>
  <rect class="box" x="444" y="40" width="228" height="130" rx="10"/>
  <text class="t" x="458" y="64">the rate</text>
  <text class="s" x="458" y="86">equal readings per engine</text>
  <text class="s" x="458" y="104">google reported apart</text>
  <text class="s" x="458" y="122">repeats clustered by question</text>
  <text class="s" x="458" y="140">with its minimum detectable</text>
  <text class="s" x="458" y="156">rate and its blind spots</text>
</svg>
