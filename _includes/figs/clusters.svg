<svg id="fig-clusters" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cl-t">
  <title id="cl-t">480 raw readings collapse into 40 question clusters that each move together</title>
  <style>
    #fig-clusters .box { fill: #ffffff; stroke: #121212; stroke-width: 1.5; }
    #fig-clusters .t { font-size: 15px; font-weight: 700; fill: #121212; }
    #fig-clusters .big { font-size: 40px; font-weight: 700; fill: #121212; }
    #fig-clusters .s { font-size: 12.5px; fill: #6b6b6b; }
    #fig-clusters .dot { fill: #121212; }
    #fig-clusters .grp { fill: #f5f5f5; stroke: #121212; stroke-width: 1.2; }
    #fig-clusters .line { stroke: #121212; stroke-width: 1.5; fill: none; }
  </style>
  <defs><marker id="cl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker></defs>
  <!-- raw -->
  <rect class="box" x="8" y="20" width="270" height="210" rx="10"/>
  <text class="big" x="24" y="70">480</text>
  <text class="t" x="24" y="94">raw readings</text>
  <text class="s" x="24" y="114">40 questions × 3 repeats × 4 engines</text>
  <g id="cl-row">
    <circle class="dot" cx="30" cy="146" r="3"/><circle class="dot" cx="40" cy="146" r="3"/><circle class="dot" cx="50" cy="146" r="3"/><circle class="dot" cx="60" cy="146" r="3"/><circle class="dot" cx="70" cy="146" r="3"/><circle class="dot" cx="80" cy="146" r="3"/><circle class="dot" cx="90" cy="146" r="3"/><circle class="dot" cx="100" cy="146" r="3"/><circle class="dot" cx="110" cy="146" r="3"/><circle class="dot" cx="120" cy="146" r="3"/><circle class="dot" cx="130" cy="146" r="3"/><circle class="dot" cx="140" cy="146" r="3"/><circle class="dot" cx="150" cy="146" r="3"/><circle class="dot" cx="160" cy="146" r="3"/><circle class="dot" cx="170" cy="146" r="3"/><circle class="dot" cx="180" cy="146" r="3"/><circle class="dot" cx="190" cy="146" r="3"/><circle class="dot" cx="200" cy="146" r="3"/><circle class="dot" cx="210" cy="146" r="3"/><circle class="dot" cx="220" cy="146" r="3"/><circle class="dot" cx="230" cy="146" r="3"/><circle class="dot" cx="240" cy="146" r="3"/><circle class="dot" cx="250" cy="146" r="3"/><circle class="dot" cx="260" cy="146" r="3"/>
  </g>
  <use href="#cl-row" y="14"/><use href="#cl-row" y="28"/><use href="#cl-row" y="42"/><use href="#cl-row" y="56"/>
  <text class="s" x="24" y="222">looks like a large sample</text>
  <!-- arrow -->
  <path class="line" d="M286 125 H338" marker-end="url(#cl-a)"/>
  <text class="s" x="290" y="114">cluster by</text>
  <text class="s" x="290" y="146">question</text>
  <!-- clustered -->
  <rect class="box" x="346" y="20" width="326" height="210" rx="10"/>
  <text class="big" x="362" y="70">40</text>
  <text class="t" x="362" y="94">groups that move together</text>
  <text class="s" x="362" y="114">the effective sample sits between 40 and 480</text>
  <g>
    <rect class="grp" x="362" y="134" width="56" height="26" rx="13"/><rect class="grp" x="424" y="134" width="56" height="26" rx="13"/><rect class="grp" x="486" y="134" width="56" height="26" rx="13"/><rect class="grp" x="548" y="134" width="56" height="26" rx="13"/><rect class="grp" x="610" y="134" width="50" height="26" rx="13"/>
    <rect class="grp" x="362" y="166" width="56" height="26" rx="13"/><rect class="grp" x="424" y="166" width="56" height="26" rx="13"/><rect class="grp" x="486" y="166" width="56" height="26" rx="13"/><rect class="grp" x="548" y="166" width="56" height="26" rx="13"/><rect class="grp" x="610" y="166" width="50" height="26" rx="13"/>
  </g>
  <text class="s" x="362" y="222">so a bigger change is needed before anything "moved"</text>
</svg>
