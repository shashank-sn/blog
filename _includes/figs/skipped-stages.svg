<svg id="fig-skipped-stages" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ss-t">
  <title id="ss-t">each skipped stage and the failure it lets through</title>
  <style>
    #fig-skipped-stages .skip { fill: #ffffff; stroke: #121212; stroke-width: 1.5; stroke-dasharray: 6 4; }
    #fig-skipped-stages .fail { fill: #121212; }
    #fig-skipped-stages .k { font-size: 15px; font-weight: 700; fill: #121212; }
    #fig-skipped-stages .f { font-size: 14px; fill: #ffffff; }
    #fig-skipped-stages .h { font-size: 13px; fill: #6b6b6b; font-weight: 500; }
    #fig-skipped-stages .line { stroke: #121212; stroke-width: 1.5; }
  </style>
  <defs><marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker></defs>
  <text class="h" x="8" y="18">skipped stage</text>
  <text class="h" x="250" y="18">what you see later</text>
  <g font-family="inherit">
    <rect class="skip" x="8" y="32" width="190" height="40" rx="8"/><text class="k" x="22" y="57">grill</text>
    <line class="line" x1="198" y1="52" x2="246" y2="52" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="32" width="422" height="40" rx="8"/><text class="f" x="266" y="57">the agent builds the wrong thing, well</text>

    <rect class="skip" x="8" y="86" width="190" height="40" rx="8"/><text class="k" x="22" y="111">spec</text>
    <line class="line" x1="198" y1="106" x2="246" y2="106" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="86" width="422" height="40" rx="8"/><text class="f" x="266" y="111">every reviewer has a different idea of done</text>

    <rect class="skip" x="8" y="140" width="190" height="40" rx="8"/><text class="k" x="22" y="165">slices</text>
    <line class="line" x1="198" y1="160" x2="246" y2="160" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="140" width="422" height="40" rx="8"/><text class="f" x="266" y="165">one giant pr that nobody can review</text>

    <rect class="skip" x="8" y="194" width="190" height="40" rx="8"/><text class="k" x="22" y="219">dogfood</text>
    <line class="line" x1="198" y1="214" x2="246" y2="214" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="194" width="422" height="40" rx="8"/><text class="f" x="266" y="219">happy path works, the empty state crashes</text>

    <rect class="skip" x="8" y="248" width="190" height="40" rx="8"/><text class="k" x="22" y="273">verify at revision</text>
    <line class="line" x1="198" y1="268" x2="246" y2="268" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="248" width="422" height="40" rx="8"/><text class="f" x="266" y="273">"tests pass" about code that changed since</text>

    <rect class="skip" x="8" y="302" width="190" height="40" rx="8"/><text class="k" x="22" y="327">two-axis review</text>
    <line class="line" x1="198" y1="322" x2="246" y2="322" marker-end="url(#ss-a)"/>
    <rect class="fail" x="250" y="302" width="422" height="40" rx="8"/><text class="f" x="266" y="327">style comments bury the missing requirement</text>
  </g>
</svg>
