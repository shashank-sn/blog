<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vp-t">
  <title id="vp-t">samples split into a build set and a held-out set, then the profile, the brief, and the check</title>
  <style>
    .box { fill: #ffffff; stroke: #121212; stroke-width: 1.5; }
    .ink { fill: #121212; }
    .wash { fill: #f5f5f5; stroke: #121212; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .t { font-size: 15px; font-weight: 700; fill: #121212; }
    .tw { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .s { font-size: 12.5px; fill: #6b6b6b; }
    .sw { font-size: 12.5px; fill: #d9d9d9; }
    .line { stroke: #121212; stroke-width: 1.5; fill: none; }
    .dash { stroke: #6b6b6b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="vp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker>
    <marker id="vp-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
  </defs>
  <!-- samples stack -->
  <g>
    <rect class="box" x="16" y="70" width="110" height="140" rx="8"/>
    <rect class="box" x="10" y="64" width="110" height="140" rx="8"/>
    <rect class="box" x="4" y="58" width="110" height="140" rx="8"/>
    <text class="t" x="18" y="86">samples</text>
    <text class="s" x="18" y="106">one writer</text>
    <text class="s" x="18" y="122">one channel</text>
    <text class="s" x="18" y="138">one format</text>
    <text class="s" x="18" y="166">five or more</text>
  </g>
  <!-- split -->
  <path class="line" d="M126 110 C150 110 150 70 176 70" marker-end="url(#vp-a)"/>
  <path class="dash" d="M126 170 C150 170 150 230 176 230" marker-end="url(#vp-g)"/>
  <rect class="box" x="178" y="40" width="130" height="60" rx="8"/>
  <text class="t" x="192" y="66">build set</text><text class="s" x="192" y="86">makes the profile</text>
  <rect class="wash" x="178" y="200" width="130" height="60" rx="8"/>
  <text class="t" x="192" y="226">held out</text><text class="s" x="192" y="246">never seen by it</text>
  <!-- profile -->
  <path class="line" d="M308 70 H342" marker-end="url(#vp-a)"/>
  <rect class="ink" x="344" y="24" width="150" height="104" rx="10"/>
  <text class="tw" x="358" y="50">profile v1</text>
  <text class="sw" x="358" y="72">rhythm, vocabulary</text>
  <text class="sw" x="358" y="90">punctuation, openings</text>
  <text class="sw" x="358" y="108">endings, banned forms</text>
  <!-- validation -->
  <path class="dash" d="M308 230 H418 V130" marker-end="url(#vp-g)"/>
  <text class="s" x="326" y="186">does it recognise these?</text>
  <!-- brief and check -->
  <path class="line" d="M494 76 H528" marker-end="url(#vp-a)"/>
  <rect class="box" x="530" y="24" width="140" height="104" rx="10"/>
  <text class="t" x="544" y="50">editing brief</text>
  <text class="s" x="544" y="72">keep: meaning,</text>
  <text class="s" x="544" y="88">evidence, rhythm</text>
  <text class="s" x="544" y="108">cut: filler, setup</text>
  <path class="line" d="M600 128 V196" marker-end="url(#vp-a)"/>
  <rect class="box" x="530" y="198" width="140" height="62" rx="10"/>
  <text class="t" x="544" y="224">check a draft</text>
  <text class="s" x="544" y="244">four reports, apart</text>
</svg>
