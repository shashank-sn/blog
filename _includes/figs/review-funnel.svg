<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-t">
  <title id="rf-t">38 ratings narrow to 19 written reviews and 6 link complaints; 19 bare ratings are set aside as unreadable</title>
  <style>
    .ink { fill: #121212; }
    .mid { fill: #6b6b6b; }
    .lite { fill: #f5f5f5; stroke: #6b6b6b; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .n { font-size: 30px; font-weight: 700; fill: #ffffff; }
    .nd { font-size: 30px; font-weight: 700; fill: #121212; }
    .l { font-size: 14px; fill: #ffffff; }
    .ld { font-size: 14px; fill: #6b6b6b; }
    .line { stroke: #6b6b6b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs><marker id="rf-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <!-- bars, width proportional: 38 -> 608px, 19 -> 304px, 6 -> 96px -->
  <rect class="ink" x="8" y="12" width="608" height="62" rx="8"/>
  <text class="n" x="24" y="54">38</text><text class="l" x="80" y="50">ratings across 11 products</text>
  <rect class="ink" x="8" y="94" width="304" height="62" rx="8" opacity="0.82"/>
  <text class="n" x="24" y="136">19</text><text class="l" x="80" y="132">written reviews</text>
  <rect class="ink" x="8" y="176" width="96" height="62" rx="8"/>
  <text class="n" x="24" y="218">6</text>
  <text class="ld" x="118" y="206">written link complaints</text>
  <text class="ld" x="118" y="224">the number you can prove</text>
  <!-- set aside -->
  <path class="line" d="M460 74 V100" marker-end="url(#rf-g)"/>
  <rect class="lite" x="336" y="102" width="280" height="54" rx="8"/>
  <text class="nd" x="350" y="140">19</text><text class="ld" x="400" y="126">bare ratings, no text</text><text class="ld" x="400" y="144">kept in the report as unreadable</text>
</svg>
