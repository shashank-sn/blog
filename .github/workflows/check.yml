name: Check

# Builds the site the same way GitHub Pages does, then checks skills, zips, front matter and links.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills, zips and posts
        run: python3 scripts/check_site.py
      - name: Build with the GitHub Pages builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check the built site
        run: python3 scripts/check_site.py _site
      - name: Keep the built site for preview
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
