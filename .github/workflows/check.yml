name: Check

# Checks plugin manifests, links, listings, figures and titles.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the repo
        run: python3 scripts/check.py
