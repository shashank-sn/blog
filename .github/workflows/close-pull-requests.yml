name: Close pull requests

# This repo takes questions as issues, not pull requests.
# pull_request_target runs from the default branch, so it also works for forks.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Thanks. This blog does not take pull requests. Please open an issue with your question or suggestion: https://github.com/$REPO/issues/new/choose"
          gh pr close "$PR" --repo "$REPO"
